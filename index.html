<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Priorización consensuada, roadmap, tablero y métricas del portafolio digital IACC 2027.">
<!-- config.js define window.PD_CONFIG con la URL y la clave pública de Supabase. Sin ella, la app funciona en modo local. -->
<script src="config.js"></script>
</head>
<body>
<!-- Archivo generado por scripts/build.mjs desde src/app.html. No lo edites a mano. -->
<title>Portafolio Digital 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: rail de navegación tenue + lienzo operativo denso (ranking, roadmap, tablero, métricas, comité); detalle en panel lateral.
   Tema generado desde 3 entradas (como Linear 2026): --base-hue (neutros cálidos), --accent-hue y --contrast (0 a 1). Todo en OKLCH. */
:root{
  --base-hue:75; --accent-hue:268; --contrast:0.5;
  --nc:0.008; --ac:0.17; --k:var(--contrast);
  --bg:oklch(97.4% var(--nc) var(--base-hue));
  --rail:oklch(95.6% var(--nc) var(--base-hue));
  --surface:oklch(99.5% calc(var(--nc) * .5) var(--base-hue));
  --surface-2:oklch(94.6% var(--nc) var(--base-hue));
  --line:oklch(calc(91.5% - var(--k) * 4%) var(--nc) var(--base-hue));
  --line-soft:oklch(calc(94% - var(--k) * 3%) var(--nc) var(--base-hue));
  --fg:oklch(calc(23% - var(--k) * 6%) calc(var(--nc) * 1.5) var(--base-hue));
  --muted:oklch(calc(53% - var(--k) * 10%) var(--nc) var(--base-hue));
  --accent:oklch(50% var(--ac) var(--accent-hue)); --accent-ink:oklch(99% 0 0); --accent-soft:oklch(94% calc(var(--ac) * .25) var(--accent-hue));
  --ok:oklch(50% .11 155); --ok-soft:oklch(94.5% .04 155);
  --warn:oklch(55% .12 70); --warn-soft:oklch(94.5% .05 80);
  --bad:oklch(52% .17 25); --bad-soft:oklch(94.5% .035 25);
  --agent:oklch(48% .17 305); --agent-soft:oklch(94.5% .04 305);
  --scrim:oklch(20% .01 var(--base-hue) / .4); --shadow:0 12px 40px oklch(20% .02 var(--base-hue) / .14);
  --f-display:'Bricolage Grotesque','Avenir Next','Segoe UI',sans-serif;
  --f-body:'Geist','Inter','Helvetica Neue','Segoe UI',system-ui,sans-serif;
  --f-mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:oklch(20.5% var(--nc) var(--base-hue)); --rail:oklch(18% var(--nc) var(--base-hue)); --surface:oklch(23.5% var(--nc) var(--base-hue)); --surface-2:oklch(27% var(--nc) var(--base-hue));
  --line:oklch(calc(31% + var(--k) * 5%) var(--nc) var(--base-hue)); --line-soft:oklch(calc(27.5% + var(--k) * 3%) var(--nc) var(--base-hue));
  --fg:oklch(calc(91% + var(--k) * 5%) calc(var(--nc) * .8) var(--base-hue)); --muted:oklch(calc(68% + var(--k) * 8%) var(--nc) var(--base-hue));
  --accent:oklch(74% calc(var(--ac) * .8) var(--accent-hue)); --accent-ink:oklch(20% .02 var(--accent-hue)); --accent-soft:oklch(32% calc(var(--ac) * .4) var(--accent-hue));
  --ok:oklch(75% .13 155); --ok-soft:oklch(30% .05 155); --warn:oklch(79% .13 75); --warn-soft:oklch(31% .05 75);
  --bad:oklch(72% .15 25); --bad-soft:oklch(30% .06 25); --agent:oklch(75% .13 305); --agent-soft:oklch(30% .06 305);
  --scrim:oklch(8% 0 0 / .55); --shadow:0 12px 40px oklch(5% 0 0 / .5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:oklch(20.5% var(--nc) var(--base-hue)); --rail:oklch(18% var(--nc) var(--base-hue)); --surface:oklch(23.5% var(--nc) var(--base-hue)); --surface-2:oklch(27% var(--nc) var(--base-hue));
  --line:oklch(calc(31% + var(--k) * 5%) var(--nc) var(--base-hue)); --line-soft:oklch(calc(27.5% + var(--k) * 3%) var(--nc) var(--base-hue));
  --fg:oklch(calc(91% + var(--k) * 5%) calc(var(--nc) * .8) var(--base-hue)); --muted:oklch(calc(68% + var(--k) * 8%) var(--nc) var(--base-hue));
  --accent:oklch(74% calc(var(--ac) * .8) var(--accent-hue)); --accent-ink:oklch(20% .02 var(--accent-hue)); --accent-soft:oklch(32% calc(var(--ac) * .4) var(--accent-hue));
  --ok:oklch(75% .13 155); --ok-soft:oklch(30% .05 155); --warn:oklch(79% .13 75); --warn-soft:oklch(31% .05 75);
  --bad:oklch(72% .15 25); --bad-soft:oklch(30% .06 25); --agent:oklch(75% .13 305); --agent-soft:oklch(30% .06 305);
  --scrim:oklch(8% 0 0 / .55); --shadow:0 12px 40px oklch(5% 0 0 / .5); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
.no-ai .btn.ai,.no-ai .ai-box,.no-ai .ai-sum{display:none!important}
/* P3: qué cambió, historial de decisiones, deshacer */
.changes{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:12px 14px;margin:0 0 18px}
.changes-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.changes-head h2{font-size:15px}
.feed{list-style:none;margin:8px 0 4px;padding:0;display:flex;flex-direction:column}
.feed li{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft);padding:2px 0}
.feed li:first-child{border-top:0}
.feed-item{all:unset;box-sizing:border-box;cursor:pointer;flex:1;min-width:0;display:flex;gap:4px;align-items:baseline;padding:6px 6px;border-radius:6px;font-size:13px;line-height:1.4;overflow-wrap:anywhere}
.feed-item:hover{background:var(--surface-2)}
.feed-item:focus-visible,.feed-x:focus-visible,.cite:focus-visible{outline:2px solid var(--accent)}
.feed-x{all:unset;cursor:pointer;width:24px;height:24px;display:grid;place-items:center;border-radius:6px;color:var(--muted);font-size:16px;flex:none}
.feed-x:hover{background:var(--surface-2);color:var(--fg)}
.ai-sum{margin-top:10px;border:1px dashed var(--agent);border-radius:8px;padding:10px 12px;background:var(--agent-soft)}
.ai-sum p{margin:6px 0 0;max-width:80ch;line-height:1.55}
.cite{all:unset;cursor:pointer;display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 3px;margin:0 1px;border-radius:4px;font:600 10.5px var(--f-mono);background:var(--surface);color:var(--agent);border:1px solid var(--agent);vertical-align:2px}
.hist{font-size:12.5px}
.hist summary{cursor:pointer;color:var(--muted);font-weight:500}
.hist ol{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:14px}
.toast[hidden]{display:none!important}
.toast-undo{all:unset;cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.toast-undo:focus-visible{outline:2px solid currentColor;outline-offset:2px}
/* P2: edición directa, foco por rol, tooltips, transición */
.cellsel{font:inherit;font-size:12.5px;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 4px;cursor:pointer;max-width:130px}
.cellsel:hover{border-color:var(--line);background:var(--surface)}
.cellsel:focus{outline:2px solid var(--accent);outline-offset:0}
.cellchip{cursor:pointer;padding-right:4px}
.cellsel.bare{color:inherit;font-size:12px;font-weight:500;padding:0 2px;border:0;max-width:none;background:transparent}
.cellsel.bare:hover{background:transparent}
.cellsel.bare option{color:var(--fg);background:var(--surface)}
.focus{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:12px 14px;margin-bottom:16px}
.focus-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.focus-list{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 16px}
.focus-item{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:4px;align-items:baseline;width:100%;padding:6px 8px;border-radius:6px;font-size:13px;line-height:1.4}
.focus-item:hover{background:var(--surface-2)}
.focus-item:focus-visible{outline:2px solid var(--accent)}
.tip{position:fixed;inset:auto;margin:0;left:0;top:0;width:max-content;max-width:300px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;font-size:12.5px;z-index:45;display:none;pointer-events:none}
.tip.on{display:block}
.tip-h{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.tip-t{font-weight:600;line-height:1.35;margin-bottom:6px}
.tip-g{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;color:var(--muted)}
.tip-g b{color:var(--fg);font-weight:500}
.tip-iss{margin-top:8px;color:var(--bad);display:flex;flex-direction:column;gap:2px}
.tip-f{margin-top:8px;color:var(--muted);font-size:11.5px}
.rm-bar:focus-visible,.rm-ms:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::view-transition-group(peek){animation-duration:.24s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(peek),::view-transition-new(peek){height:100%;object-fit:cover}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1;font-variant-numeric:tabular-nums}
/* Tipografía: sans neutra para lectura, mono solo para códigos, fechas y cifras alineadas */
td.small.num,.due,.code,.kr-nums,.tip-g b.num{font-family:var(--f-mono);letter-spacing:-.01em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.eyebrow{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:20px;padding:20px 12px;background:var(--rail);border-right:1px solid var(--line-soft)}
.brand{font:700 16px/1.2 var(--f-display);padding:0 8px;color:var(--fg)}
.brand small{display:block;margin-top:4px;font:600 10.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:7px;color:var(--muted);font-weight:500;font-size:13.5px;white-space:nowrap}
.nav button:hover{color:var(--fg);background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line-soft)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav svg{width:14px;height:14px;flex:none;opacity:.8}
.nav kbd{margin-left:auto;opacity:0;transition:opacity .15s}
.nav button:hover kbd,.nav button:focus-visible kbd{opacity:1}
kbd{font:500 10.5px var(--f-mono);padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--muted);background:var(--bg)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 8px}
.cmdk{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line-soft);border-radius:7px;color:var(--muted);font-size:12.5px;background:var(--surface)}
.cmdk:hover{border-color:var(--line);color:var(--fg)}
.cmdk:focus-visible{outline:2px solid var(--accent)}
.me{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);min-width:0}

.main{min-width:0;padding-inline:32px;padding-block:26px 80px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px 20px;margin-bottom:20px}
.page-head .row{min-height:34px}
.page-head h1{font-size:24px;font-weight:700}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:68ch;font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1 1 200px;min-width:0}
.banner{display:block;padding:9px 14px;border-radius:8px;background:var(--surface-2);color:var(--fg);margin-bottom:16px;font-size:12.5px;border-left:3px solid var(--warn)}

.btn{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--f-body);padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.ai{border-color:var(--agent);color:var(--agent);background:var(--agent-soft)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface);border-color:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px}

.inp,select.inp,textarea.inp{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea.inp{resize:vertical;min-height:72px;line-height:1.5}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label,.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.fld .hint{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
.check{display:flex;gap:8px;align-items:center;font-size:13px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--muted);white-space:nowrap;line-height:1.5}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
/* Estado = color + forma + texto: círculo en curso, triángulo en riesgo, cuadrado fuera de curso */
.h-en_riesgo .dot{border-radius:0;width:8px;height:7px;clip-path:polygon(50% 0,100% 100%,0 100%)}
.h-fuera .dot{border-radius:1.5px;width:7px;height:7px}
.chip.accent .dot{border-radius:1px;transform:rotate(45deg);width:6px;height:6px}
.h-en_curso{background:var(--ok-soft);color:var(--ok)}
.h-en_riesgo{background:var(--warn-soft);color:var(--warn)}
.h-fuera{background:var(--bad-soft);color:var(--bad)}
.chip.outline{background:transparent;border:1px solid var(--line)}
.chip.agent{background:var(--agent-soft);color:var(--agent)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.example{background:transparent;border:1px dashed var(--muted);color:var(--muted);font-size:11px;padding:0 6px}
.code{font:600 11.5px var(--f-mono);color:var(--muted);letter-spacing:.02em}

.av{width:20px;height:20px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font:600 9px var(--f-body);background:var(--surface-2);color:var(--muted);object-fit:cover;border:1px solid var(--line)}
.av-agent{background:var(--agent-soft);color:var(--agent);border-color:transparent;font-size:8.5px}
.pchip{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%;font-size:12.5px}
.pchip .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip.none{color:var(--muted);font-style:italic}
.pchip.agent .pn{color:var(--agent);font-weight:500}
.roles{display:flex;gap:2px}
.roles .pchip .pn{display:none}

/* Portafolio */
.summary{display:flex;flex-wrap:wrap;gap:8px 22px;margin-bottom:16px;font-size:13px;color:var(--muted)}
.summary b{color:var(--fg);font:600 15px var(--f-mono);margin-right:4px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse}
.pf{min-width:960px}
th{font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
.rank{font:600 13px var(--f-mono);color:var(--muted);width:36px}
.iname{font-weight:600;line-height:1.3}
.iname-sub{display:flex;gap:8px;align-items:center;margin-top:3px;font-size:12px;color:var(--muted)}
.ipcell{width:120px}
.ip{font:600 16px var(--f-mono);font-variant-numeric:tabular-nums}
.ipbar{height:4px;border-radius:2px;background:var(--surface-2);margin-top:4px;overflow:hidden}
.ipbar i{display:block;height:100%;background:var(--muted);border-radius:2px;opacity:.55}
tr.capline td{padding:0;border-bottom:0}
.capline-inner{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--surface-2);color:var(--fg);font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase}
.capline-inner::after{content:"";flex:1;border-top:1px dashed var(--muted)}

/* Roadmap */
.rm-wrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:10px;background:var(--surface)}
.rm{min-width:980px;position:relative}
.rm-links{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.dec{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.dec.rev{background:var(--bg)}
.dec.rev .dec-t{text-decoration:line-through;color:var(--muted)}
.dec-t{font:600 15px/1.35 var(--f-body);margin:0;letter-spacing:0}
.dec-r{margin:0;white-space:pre-wrap;max-width:72ch;color:var(--fg)}
.session{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.session-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.session-head h2{font-size:16px}
.multi{display:flex;flex-direction:column;gap:2px;max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg)}
.dep-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.dep-row .t{flex:1 1 220px;min-width:0}
.acta{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:50vh;overflow:auto;font-size:13.5px}
.rm-head,.rm-row{display:grid;grid-template-columns:250px minmax(0,1fr)}
.rm-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line)}
.rm-months{display:grid;grid-template-columns:repeat(12,1fr)}
.rm-months span{padding:9px 8px;font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line)}
.rm-months span.q{color:var(--fg)}
.rm-group{padding:10px 14px 6px;font:600 12px var(--f-body);color:var(--muted);border-bottom:1px solid var(--line);background:var(--bg);letter-spacing:.02em}
.rm-label{padding:10px 14px;border-bottom:1px solid var(--line);min-width:0;cursor:pointer}
.rm-label .iname{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    update: async d => { const c = docs.get(path); if (!c) throw { code: 'invalid_argument' }; docs.set(path, merge(c, clone(d))); notify(); },

/* ---------- Puntaje y consenso ---------- */

  if (bs.length) {

    keys.forEach(k => { const xs = bs.map(x => +x.b[k]); const m = avg(xs); out.mean[k] = m; out.sd[k] = Math.sqrt(avg(xs.map(x => (x - m) ** 2))); });

  if (c.state === 'uno') return '<span class="chip outline">1 evaluación</span>';
  if (c.state === 'disenso') return `<span class="chip h-en_riesgo" title="Hay criterios con dispersión mayor a ${S.config.consensusThreshold}"><span class="dot"></span>${c.n} eval. · conversar</span>`;

}
function rankMap() {

}

/* ---------- Dependencias ---------- */

    <div><h3 style="font-size:16px;margin-bottom:2px">Tu evaluación</h3><p class="small muted" style="margin:0 0 4px">1 = muy bajo · 5 = muy alto. Nadie ve tu puntaje individual por nombre en el ranking; el comité ve promedio y dispersión.</p>
    ${crit.map(x => `<div class="score-row"><div><div style="font-weight:600">${x.label}</div><div class="small muted">${esc(x.hint)}</div></div>${seg(x.key, mine[x.key])}</div>`).join('')}</div>

function renderPal(q) {
  const all = [...VIEWS.map(v => ({ label: 'Ir a ' + v.label, hint: v.key, run: () => go(v.k) })),
    { label: 'Nueva iniciativa', hint: 'N', run: openNewInit }, { label: 'Nuevo ítem', hint: 'C', run: () => openItem(null, {}) }, { label: 'Método de priorización', run: openMethod }, { label: 'Registrar decisión del comité', hint: 'D', run: () => openDecision() },
    ...S.inits.map(i => ({ label: i.code + ' · ' + i.name, hint: i.area, run: () => openDrawer(i.id) }))];
  const nq = norm(q); palList = nq ? all.filter(x => norm(x.label + ' ' + (x.hint || '')).includes(nq)) : all;
  palSel = clamp(palSel, 0, Math.max(0, palList.length - 1));
  $('#pal-list').innerHTML = palList.length ? palList.slice(0, 40).map((x, n) => `<div class="pal-opt" role="option" data-pal="${n}" aria-selected="${n === palSel}">${esc(x.label)}${x.hint ? `<small>${esc(x.hint)}</small>` : ''}</div>`).join('') : '<div class="pick-empty">Sin resultados.</div>';
}

function readRef(id) { const h = document.getElementById(id + '-ref'); return h ? h.value : ''; }

async function saveInit() {
  const i = initById(S.drawer.id); if (!i || !guardWrite()) return;

async function deleteInit() {
  const i = initById(S.drawer.id); if (!i || !guardWrite()) return;
  if (S.confirmDel !== i.id) { S.confirmDel = i.id; renderDrawer(); return; }
  closeDrawer();
  for (const t of S.items.filter(t => t.initiativeId === i.id)) await write(db.doc('items/' + t.id).delete());
  for (const u of S.updates.filter(u => u.initiativeId === i.id)) await write(db.doc('updates/' + u.id).delete());
  await write(db.doc('initiatives/' + i.id).delete(), 'Iniciativa eliminada');
}
async function removeExamples() {
  if (!guardWrite()) return;
  if (S.confirmDel !== 'examples') { S.confirmDel = 'examples'; render(); return; }
  S.confirmDel = null;
  const ex = S.inits.filter(i => i.ejemplo); const ids = new Set(ex.map(i => i.id));
  for (const t of S.items.filter(t => ids.has(t.initiativeId))) await write(db.doc('items/' + t.id).delete());
  for (const u of S.updates.filter(u => ids.has(u.initiativeId))) await write(db.doc('updates/' + u.id).delete());
  for (const d of S.decisions.filter(d => d.ejemplo || ((d.initiativeIds || []).length && d.initiativeIds.every(x => ids.has(x))))) await write(db.doc('decisions/' + d.id).delete());

async function saveItem() {
  const err = $('#m-err'); const title = $('#m-title').value.trim();
  if (!title) { err.textContent = 'Escribe un título.'; err.hidden = false; return; }
  const assignee = readRef('m-assignee'), dri = readRef('m-dri');
  if (refKind(assignee) === 'a' && !dri) { err.textContent = 'Un ítem ejecutado por un agente IA necesita una persona responsable que revise su trabajo.'; err.hidden = false; return; }
  const id = S.modal.id; const prev = id ? S.items.find(x => x.id === id) : null;

function stamp(data, prev, status) {
  data.startedAt = prev && prev.startedAt ? prev.startedAt : ((status === 'doing' || status === 'review' || status === 'done') ? Date.now() : null);

    case 'delete-init': deleteInit(); break;
    case 'remove-examples': removeExamples(); break;
    case 'add-kr': if (S.krDraft) { S.krDraft.list.push({ name: '', baseline: '', current: '', target: '', unit: '' }); S.drawerDirty = true; renderDrawer(); const n = S.krDraft.list.length - 1; const f = $(`#kr-${n}-name`); if (f) f.focus(); } break;
    case 'del-kr': if (S.krDraft) { S.krDraft.list.splice(+a.dataset.n, 1); S.drawerDirty = true; renderDrawer(); } break;
    case 'save-krs': saveKRs(); break;
    case 'save-vote': saveVote(); break;
    case 'agree': setAgreed(false); break;
    case 'unagree': setAgreed(true); break;
    case 'publish-update': publishUpdate(); break;
    case 'ai-decompose': aiDecompose(); break;
    case 'ai-accept': aiAccept(); break;
    case 'ai-discard': S.ai.decomp = null; renderDrawer(); break;
    case 'ai-update': aiUpdate(); break;
    case 'bfilter': S.boardFilter = a.dataset.f; render(); break;
    case 'board-of': S.boardInit = id; try { localStorage.setItem('pd27.board', id); } catch (er) {} closeDrawer(); go('tablero'); break;
    case 'year': S.year = +a.dataset.y; render(); break;
    case 'signout': if (S.sb) S.sb.auth.signOut().then(() => location.reload()); break;
    case 'add-dep': addDep(); break;
    case 'del-dep': delDep(id); break;
    case 'new-dec': openDecision(a.dataset.init); break;
    case 'save-dec': saveDec(); break;
    case 'revoke-dec': openRevoke(id); break;
    case 'edit-dec': openDecision(null, id); break;
    case 'feed-dismiss': dismissFact(a.dataset.f); break;
    case 'feed-restore': S.dismissed = new Set(); saveDismissed(); render(); break;
    case 'feed-days': S.feedDays = +a.dataset.d; S.ai.feedSum = null; render(); break;
    case 'feed-more': S.feedAll = !S.feedAll; render(); break;
    case 'feed-ai': aiFeed(); break;
    case 'feed-ai-discard': S.ai.feedSum = null; render(); break;
    case 'confirm-revoke': confirmRevoke(); break;
    case 'delete-dec': deleteDec(id); break;
    case 'acta': aiActa(a.dataset.date); break;
    case 'copy-acta': { const t = $('#acta-out').textContent; const sel = () => { const r = document.createRange(); r.selectNodeContents($('#acta-out')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Texto seleccionado: cópialo con ⌘C o Ctrl+C'); }; try { navigator.clipboard.writeText(t).then(() => toast('Acta copiada'), sel); } catch (er) { sel(); } break; }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'f-q') { S.q = t.value; render(); return; }
  if (t.id === 'd-q') { S.dQ = t.value; render(); return; }
  if (t.id === 'pal-q') { palSel = 0; renderPal(t.value); return; }
  const pk = t.closest('.picker');
  if (pk && t.type !== 'hidden') { t.dataset.touched = '1'; delete t.dataset.uidInput; pk.querySelector('input[type=hidden]').value = t.value.trim() ? 't:' + t.value.trim() : ''; openPick(pk, t.value); }
  if (t.dataset.kr != null && S.krDraft) { S.krDraft.list[+t.dataset.kr][t.dataset.f] = t.value; }
  if ($('#drawer').contains(t) && t.id !== 'pal-q') {
    const was = S.drawerDirty; S.drawerDirty = true;
    if (!was && S.drawer && S.drawer.tab === 'resumen') { const f = $('#drawer .d-foot'); if (f && !f.querySelector('.dirty-note')) { const s = document.createElement('span'); s.className = 'small muted dirty-note'; s.textContent = 'Cambios sin guardar'; f.children[0].after(s); } }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'f-mine') { S.mineOnly = t.checked; try { localStorage.setItem('pd27.mine', t.checked ? '1' : '0'); } catch (er) {} render(); return; }
  if (t.dataset.inline && t.dataset.id) { const f = t.dataset.inline; const i = initById(t.dataset.id); if (i && guardWrite()) { const prev = i[f]; const ref = db.doc('initiatives/' + i.id); write(ref.update({ [f]: t.value, updatedAt: Date.now() })).then(ok => { if (ok) toast(`${i.code}: ${f === 'stage' ? 'etapa' : 'salud'} cambiada a «${f === 'stage' ? t.value : HEALTH[t.value]}»`, () => write(ref.update({ [f]: prev, updatedAt: Date.now() }), 'Cambio deshecho')); }); } return; }
  if (t.id === 'f-area') { S.fArea = t.value; render(); }
  else if (t.id === 'f-method') { S.fMethod = t.value; render(); }
  else if (t.id === 'b-init') { S.boardInit = t.value; try { localStorage.setItem('pd27.board', t.value); } catch (er) {} render(); }
  else if (t.id === 'd-type') { S.dType = t.value; render(); }
  else if (t.id === 'd-init') { S.dInit = t.value; render(); }
  else if (t.id === 'x-type') syncApply();
  else if (t.id === 'm-init') { $('#m-parent').innerHTML = parentOpts(t.value, '', S.modal && S.modal.id); }
  else if (t.dataset.aisel != null && S.ai.decomp) { const [a, b] = t.dataset.aisel.split('.').map(Number); const ep = S.ai.decomp.epics[a]; if (b == null) { ep.on = t.checked; } else ep.children[b].on = t.checked; }
  else if ($('#drawer').contains(t)) S.drawerDirty = true;
});
document.addEventListener('focusin', e => { const pk = e.target.closest && e.target.closest('.picker'); if (pk && e.target.type !== 'hidden') openPick(pk, e.target.dataset.touched ? e.target.value : ''); });
document.addEventListener('focusout', e => { const pk = e.target.closest && e.target.closest('.picker'); if (pk) setTimeout(() => { if (!pk.contains(document.activeElement)) { const m = pk.querySelector('.pick-menu'); if (m) m.hidden = true; } }, 150); });
document.addEventListener('mousedown', e => { if (e.target.closest('.pick-opt')) e.preventDefault(); });

document.addEventListener('keydown', e => {
  const pOpen = !$('#palette').hidden;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); pOpen ? closePalette() : openPalette(); return; }
  if (pOpen) {
    if (e.key === 'Escape') { closePalette(); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); palSel = clamp(palSel + (e.key === 'ArrowDown' ? 1 : -1), 0, Math.max(0, Math.min(39, palList.length - 1))); renderPal($('#pal-q').value); const s = $('#pal-list [aria-selected="true"]'); if (s) s.scrollIntoView({ block: 'nearest' }); return; }
    if (e.key === 'Enter') { e.preventDefault(); runPal(palSel); return; }
    return;
  }
  if (e.key === 'Escape') { if (!$('#modal').hidden) { closeModal(); return; } if (S.drawer) { closeDrawer(); return; } }
  const t = e.target; const typing = t.matches && t.matches('input,textarea,select,[contenteditable]');
  if (e.key === 'Enter' && !typing && t.matches && t.matches('[data-action][tabindex]')) { t.click(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey || !$('#modal').hidden) return;
  const v = VIEWS.find(x => x.key === e.key); if (v) { if (S.drawer) closeDrawer(); go(v.k); return; }
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openNewInit(); }
  if ((e.key === 'd' || e.key === 'D') && S.inits.length) { e.preventDefault(); openDecision(S.drawer && S.drawer.id); }
  if ((e.key === 'c' || e.key === 'C') && S.inits.length) { e.preventDefault(); openItem(null, {}); }
});

/* Arrastrar y soltar en el tablero */
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('[data-drag]'); if (!c) return; dragId = c.dataset.drag; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (er) {} });
document.addEventListener('dragend', e => { $$('.card.dragging').forEach(c => c.classList.remove('dragging')); $$('.col.over').forEach(c => c.classList.remove('over')); dragId = null; });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('[data-drop]'); if (!col || !dragId) return; e.preventDefault(); $$('.col.over').forEach(c => c !== col && c.classList.remove('over')); col.classList.add('over'); });
document.addEventListener('drop', e => { const col = e.target.closest && e.target.closest('[data-drop]'); if (!col || !dragId) return; e.preventDefault(); col.classList.remove('over'); moveItem(dragId, col.dataset.drop); dragId = null; });

/* ---------- Arranque ---------- */
function onErr(e) { if (e && e.code === 'revoked') { S.canWrite = false; } else toast('Se perdió la conexión con el portafolio. Recarga la página.'); }
async function boot() {
  render();
  const c = window.claude;
  if (c && c.use) { try { [db, user, sample] = await Promise.all([c.use('db'), c.use('user'), c.use('sample')]); } catch (e) {} }
  else { const cfg = window.PD_CONFIG; if (cfg && cfg.supabaseUrl && cfg.supabaseAnonKey) { try { if (!(await connectSupabase(cfg))) return; } catch (e) { toast('No se pudo conectar con el servidor del portafolio. Se abre en modo local.'); db = null; user = null; } } }
  if (!sample) document.body.classList.add('no-ai');
  if (!db) { db = memoryDB(c ? null : 'pd27.local'); S.offline = true; S.uid = 'local'; S.canAdmin = true; }
  else if (user) { S.uid = await user.id(); const w = await user.can('data.write'); S.canWrite = w !== false; S.canAdmin = await user.canEdit(); }
  let got = 0; const ready = () => { if (++got >= 2) { S.loaded = true; } scheduleRender(); };
  let gi = false, gt = false;
  db.collection('initiatives').onSnapshot(s => { S.inits = s.docs.map(d => ({ id: d.id, ...d.data() })).map(i => ({ ...i, code: i.code || '—', name: i.name || 'Sin nombre' })); if (!gi) { gi = true; ready(); } else scheduleRender(); }, onErr);
  db.collection('items').onSnapshot(s => { S.items = s.docs.map(d => ({ id: d.id, ...d.data() })).map(t => ({ ...t, title: t.title || 'Sin título', status: t.status || 'backlog' })); if (!gt) { gt = true; ready(); } else scheduleRender(); }, onErr);
  db.collection('updates').onSnapshot(s => { S.updates = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(u => typeof u.text === 'string'); scheduleRender(); }, onErr);
  db.collection('decisions').onSnapshot(s => { S.decisions = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(d => typeof d.title === 'string'); scheduleRender(); }, onErr);
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.view === 'roadmap') drawDepLinks(); }, 120); });
  db.collection('votes').onSnapshot(s => { const v = {}; s.docs.forEach(d => v[d.id] = d.data()); S.votes = v; scheduleRender(); }, onErr);
  db.doc('settings/method').onSnapshot(s => {
    const d = s.exists ? s.data() : null; const cfg = clone(DEFAULT_CONFIG);
    if (d) { if (Array.isArray(d.criteria) && d.criteria.length === cfg.criteria.length) cfg.criteria = cfg.criteria.map((x, n) => ({ ...x, ...d.criteria[n], key: x.key })); if (Array.isArray(d.areas) && d.areas.length) cfg.areas = d.areas.map(String); ['capacity', 'consensusThreshold'].forEach(k => { if (+d[k] > 0) cfg[k] = +d[k]; }); ['effortLabel', 'effortHint'].forEach(k => { if (typeof d[k] === 'string') cfg[k] = d[k]; }); }
    S.config = cfg; scheduleRender();
  }, onErr);
}
boot();
})();
</script>
